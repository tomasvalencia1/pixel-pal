<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Clawd Flotante</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="panel" class="hit hidden">
    <div class="p-head">
      <span class="p-avatar" id="pAvatar">🦀</span>
      <div class="p-id">
        <div class="p-top"><span class="p-name" id="pName">Clawd</span><span id="pin" class="pin" title="Panel fijado (clic en Clawd para soltarlo)">📌</span></div>
        <div id="boost" class="boost" title="Ver tus logros"></div>
      </div>
    </div>
    <div class="tiles">
      <button id="talkbtn" class="tile" type="button" title="Hablar con Clawd (Ctrl+Alt+Espacio)"><span class="t-i">💬</span><span class="t-l">Hablar</span></button>
      <button id="pomobtn" class="tile" type="button" title="Modo enfoque: 25 min de trabajo y 5 de descanso"><span class="t-i">🍅</span><span class="t-l">Enfoque</span></button>
      <button id="rembtn" class="tile" type="button" title="Recordatorio rápido"><span class="t-i">⏰</span><span class="t-l">Recordar</span></button>
      <button id="hatbtn" class="tile" type="button" title="Personajes y accesorios (todo gratis)"><span class="t-i">🛍️</span><span class="t-l">Tienda</span></button>
      <button id="sit" class="tile" type="button" title="Quedarse quieto en su sitio"><span class="t-i">🪑</span><span class="t-l">Sentado</span></button>
      <button id="dance" class="tile on" type="button" title="Bailar cuando suene música"><span class="t-i">🎵</span><span class="t-l">Baile</span></button>
      <button id="sound" class="tile on" type="button" title="Sonidos de Clawd"><span class="t-i">🔊</span><span class="t-l">Sonido</span></button>
      <button id="morebtn" class="tile" type="button" title="Más opciones"><span class="t-i">⋯</span><span class="t-l">Más</span></button>
    </div>
    <div id="more" class="more hidden">
      <div class="more-row">
        <button id="agendabtn" class="chip" type="button" title="Tu día: recordatorios, notas y lo que llevas hecho">📅 Hoy</button>
        <button id="notesbtn" class="chip" type="button" title="Notas rápidas">📝 Notas</button>
        <button id="sessbtn" class="chip" type="button" title="Ventana de sesiones (también al soltar un archivo sobre Clawd)">🗂 Sesiones</button>
        <button id="brainbtn" class="chip" type="button" title="Charlar de todo con Claude Haiku (opcional, con tu clave)">🧠 Haiku</button>
        <button id="settingsbtn" class="chip" type="button" title="Conexión con Claude Code, arranque con Windows">🔌 Ajustes</button>
        <button id="tutorialbtn" class="chip" type="button" title="Ver el tutorial otra vez">📖 Tutorial</button>
        <button id="optbtn" class="chip" type="button" title="Todas las opciones: subirse a ventanas, pantalla completa, notificaciones…">⚙️ Opciones</button>
        <button id="hidebtn" class="chip" type="button" title="Vuelve con Ctrl+Alt+C o con el icono de la bandeja">🙈 Ocultar</button>
      </div>
    </div>
    <div id="remform" class="remform hidden">
      <input id="remtext" type="text" maxlength="80" placeholder="¿Qué te recuerdo? (opcional)" autocomplete="off">
      <div class="rem-row">
        <button class="chip" type="button" data-min="10">10 min</button>
        <button class="chip" type="button" data-min="30">30 min</button>
        <button class="chip" type="button" data-min="60">1 hora</button>
      </div>
      <div id="remlist"></div>
    </div>
    <div id="notesbox" class="remform hidden">
      <input id="notetext" type="text" maxlength="120" placeholder="Escribe una nota y pulsa Enter" autocomplete="off">
      <div id="notelist"></div>
    </div>
    <div id="nowplaying" class="hidden"></div>
    <div class="p-section"><span>Sesiones de Claude</span><span id="pCount"></span></div>
    <div id="cards"></div>
  </div>

  <div id="talk" class="hit hidden">
    <div class="talk-head">
      <span class="talk-title" id="talkTitle">💬 Habla con Clawd</span>
      <span class="talk-brain" id="talkBrain"></span>
      <button id="talkKey" class="talk-hbtn" type="button" title="Cerebro de Haiku (opcional)">🧠</button>
      <button id="talkClose" class="talk-hbtn" type="button" title="Cerrar (Esc)">✕</button>
    </div>
    <div id="talkLog" class="talk-log"></div>
    <form id="talkForm" class="talk-form" autocomplete="off">
      <button type="button" id="talkMic" class="talk-mic" title="Hablar por el micrófono">🎤</button>
      <input id="talkInput" type="text" maxlength="300" placeholder="Escribe o pulsa 🎤…">
      <button type="submit" class="talk-send" title="Enviar">➤</button>
    </form>
  </div>

  <div id="stage">
    <div id="caption" class="hidden"></div>
    <div id="bubble" class="hidden"></div>
    <div id="sprite">
      <canvas id="clawd"></canvas>
    </div>
  </div>

  <script src="catalog.js"></script>
  <script src="clawd.js"></script>
  <script src="skins.js"></script>
  <script src="phrases.js"></script>
  <script src="panel.js"></script>
  <script src="app.js"></script>
  <script src="extras.js"></script>
  <script src="boost.js"></script>
  <script src="characters.js"></script>
  <script src="talk.js"></script>
  <script src="menu.js"></script>
</body>
</html>
