<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Clawd Flotante</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="panel" class="hit hidden">
    <div class="panel-head">
      <span class="panel-title">Sesiones</span>
      <span class="head-right">
        <button id="sit" class="sit-btn" type="button">🪑 Quédate sentado</button>
        <span id="pin" class="pin" title="Panel fijado">📌</span>
      </span>
    </div>
    <div class="opts">
      <button id="dance" class="chip on" type="button" title="Bailar cuando suene música">🎵 Baile</button>
      <button id="sound" class="chip on" type="button" title="Sonidos de Clawd">🔊 Sonido</button>
      <button id="sessbtn" class="chip" type="button" title="Ventana de sesiones">🗂 Sesiones</button>
      <button id="hidebtn" class="chip" type="button" title="Vuelve con Ctrl+Alt+C o con el icono de la bandeja">🙈 Ocultar</button>
    </div>
    <div class="opts">
      <button id="settingsbtn" class="chip" type="button" title="Ajustes">⚙️ Ajustes</button>
      <button id="tutorialbtn" class="chip" type="button" title="Ver el tutorial">📖 Tutorial</button>
    </div>
    <div class="opts">
      <button id="pomobtn" class="chip" type="button" title="Modo enfoque: 25 min de trabajo y 5 de descanso">🍅 Enfoque</button>
      <button id="rembtn" class="chip" type="button" title="Recordatorio rápido">⏰ Recordar</button>
      <button id="hatbtn" class="chip" type="button" title="Personajes y accesorios (todo gratis)">🛍️ Tienda</button>
    </div>
    <div id="remform" class="remform hidden">
      <input id="remtext" type="text" maxlength="80" placeholder="¿Qué te recuerdo? (opcional)" autocomplete="off">
      <div class="rem-row">
        <button class="chip" type="button" data-min="10">10 min</button>
        <button class="chip" type="button" data-min="30">30 min</button>
        <button class="chip" type="button" data-min="60">1 hora</button>
      </div>
      <div id="remlist"></div>
    </div>
    <div id="boost" class="boost" title="Ver tus logros"></div>
    <div id="nowplaying" class="hidden"></div>
    <div id="cards"></div>
  </div>

  <div id="stage">
    <div id="caption" class="hidden"></div>
    <div id="bubble" class="hidden"></div>
    <div id="sprite">
      <canvas id="clawd"></canvas>
    </div>
  </div>

  <script src="catalog.js"></script>
  <script src="clawd.js"></script>
  <script src="skins.js"></script>
  <script src="phrases.js"></script>
  <script src="panel.js"></script>
  <script src="app.js"></script>
  <script src="extras.js"></script>
  <script src="boost.js"></script>
  <script src="characters.js"></script>
</body>
</html>
