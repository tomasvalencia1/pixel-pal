<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Tienda de Clawd</title>
  <style>
    :root { --bg: #1c1a18; --card: rgba(255, 255, 255, 0.055); --line: rgba(255, 255, 255, 0.09); --text: #f3eee9; --muted: #a8a19a; --accent: #e0a030; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 "Segoe UI", system-ui, sans-serif; user-select: none; }
    body { display: flex; flex-direction: column; border: 1px solid var(--line); overflow: hidden; }
    header { display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 16px; -webkit-app-region: drag; border-bottom: 1px solid var(--line); }
    header h1 { flex: 1; margin: 0; font-size: 14px; font-weight: 600; }
    header .x { -webkit-app-region: no-drag; background: none; border: 0; color: var(--muted); font-size: 16px; cursor: pointer; border-radius: 6px; width: 30px; height: 30px; }
    header .x:hover { background: rgba(255, 255, 255, 0.1); color: var(--text); }
    main { flex: 1; display: flex; min-height: 0; }
    .stage { width: 210px; flex: none; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; border-right: 1px solid var(--line); }
    .stage .box { width: 178px; height: 200px; border-radius: 14px; background: radial-gradient(circle at 50% 62%, rgba(224, 160, 48, 0.16), rgba(255, 255, 255, 0.03) 70%); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; }
    #sprite { width: 150px; height: 172px; image-rendering: pixelated; transition: opacity 0.5s ease; }
    #name { font-size: 16px; font-weight: 700; }
    #desc { font-size: 12px; color: var(--muted); text-align: center; min-height: 52px; }
    #said { font-size: 12px; text-align: center; background: #fffaf5; color: #2a2522; border-radius: 10px; padding: 5px 9px; min-height: 0; }
    #said:empty { display: none; }
    .side { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .tabs { display: flex; gap: 4px; padding: 10px 12px 0; border-bottom: 1px solid var(--line); }
    .tab { font: inherit; font-weight: 600; color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 7px 10px; cursor: pointer; }
    .tab:hover { color: var(--text); }
    .tab.on { color: var(--text); border-bottom-color: var(--accent); }
    .grid { flex: 1; overflow-y: auto; padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; align-content: start; }
    .grid::-webkit-scrollbar { width: 8px; }
    .grid::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
    .item { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; }
    .item:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); }
    .item.on { border-color: var(--accent); background: rgba(224, 160, 48, 0.14); }
    .item:disabled { opacity: 0.45; cursor: default; }
    .item .em { font-size: 24px; line-height: 1.1; }
    .item .nm { font-size: 12px; font-weight: 600; }
    .item .tag { font-size: 10.5px; color: var(--muted); }
    .item.on .tag { color: var(--accent); }
    footer { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
    footer .hint { flex: 1; font-size: 11.5px; color: var(--muted); }
    .btn { font: inherit; font-weight: 600; color: var(--text); background: rgba(255, 255, 255, 0.09); border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 9px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
    .btn:hover { background: rgba(255, 255, 255, 0.15); }
  </style>
</head>
<body>
  <header>
    <h1>🛍️ Tienda de Clawd · todo gratis</h1>
    <button class="x" id="close" type="button" title="Cerrar">✕</button>
  </header>
  <main>
    <div class="stage">
      <div class="box"><canvas id="sprite"></canvas></div>
      <div id="name"></div>
      <div id="desc"></div>
      <button class="btn" id="eggbtn" type="button" title="Mira su sorpresa">🥚 Ver su sorpresa</button>
      <div id="said"></div>
    </div>
    <div class="side">
      <div class="tabs" id="tabs">
        <button class="tab on" type="button" data-tab="skins">Personajes</button>
        <button class="tab" type="button" data-tab="hats">Sombreros</button>
        <button class="tab" type="button" data-tab="glasses">Gafas</button>
        <button class="tab" type="button" data-tab="neck">Cuello</button>
      </div>
      <div class="grid" id="grid"></div>
      <footer>
        <span class="hint" id="hint">Pasa el ratón por encima para probártelo y haz clic para ponértelo.</span>
        <button class="btn" id="reset" type="button">Quitar accesorios</button>
      </footer>
    </div>
  </main>
  <script src="catalog.js"></script>
  <script src="clawd.js"></script>
  <script src="skins.js"></script>
  <script src="shop.js"></script>
</body>
</html>
