<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Bienvenido a Clawd</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    main { display: flex; gap: 24px; align-items: flex-start; padding: 22px 26px; }
    .stage { flex: none; width: 200px; display: flex; flex-direction: column; align-items: center; gap: 8px; position: sticky; top: 0; }
    .stage .box { width: 200px; height: 220px; border-radius: 16px; background: radial-gradient(circle at 50% 60%, rgba(63, 184, 168, 0.16), rgba(255, 255, 255, 0.03) 70%); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; }
    .stage canvas { width: 160px; height: 184px; image-rendering: pixelated; }
    .stage .label { font-size: 12px; color: var(--muted); text-align: center; min-height: 18px; }
    .content { flex: 1; min-width: 0; }
    .content h2 { margin-bottom: 10px; }
    .tries { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 4px; }
    .tip { font-size: 12.5px; color: var(--muted); border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; margin: 10px 0; }
    footer { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--line); }
    .dots { flex: 1; display: flex; gap: 6px; justify-content: center; }
    .dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, 0.18); cursor: pointer; }
    .dots i.on { background: var(--accent); width: 20px; border-radius: 4px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
    .grid2 .card { margin: 0; padding: 9px 11px; font-size: 12.5px; }
    .grid2 .card b { display: block; margin-bottom: 2px; font-size: 13px; }
    @media (max-width: 620px) { main { flex-direction: column; align-items: center; } .stage { position: static; } .grid2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>🦀 Bienvenido a Clawd Flotante</h1>
    <button class="x" id="close" type="button" title="Cerrar (puedes volver a verlo desde Ajustes)">✕</button>
  </header>
  <main>
    <div class="stage">
      <div class="box"><canvas id="sprite"></canvas></div>
      <div class="label" id="label"></div>
    </div>
    <div class="content" id="content"></div>
  </main>
  <footer>
    <button class="btn" id="prev" type="button">← Atrás</button>
    <div class="dots" id="dots"></div>
    <button class="btn primary" id="next" type="button">Siguiente →</button>
  </footer>
  <script src="clawd.js"></script>
  <script src="tutorial.js"></script>
</body>
</html>
