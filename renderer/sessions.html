<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Clawd · Sesiones</title>
  <style>
    :root { --bg: #1c1a18; --card: rgba(255,255,255,0.06); --text: #f3eee9; --muted: #a8a19a; --orange: #d97757; --red: #e5484d; --green: #3fb950; --violet: #a79bf5; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
    body { display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.1); }
    header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; -webkit-app-region: drag; border-bottom: 1px solid rgba(255,255,255,0.08); }
    header h1 { flex: 1; margin: 0; font-size: 14px; font-weight: 600; }
    header button { -webkit-app-region: no-drag; background: none; border: 0; color: var(--muted); font-size: 16px; cursor: pointer; border-radius: 6px; width: 28px; height: 28px; }
    header button:hover { background: rgba(255,255,255,0.1); color: var(--text); }
    main { flex: 1; overflow-y: auto; padding: 12px; }
    h2 { margin: 4px 2px 8px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .card { background: var(--card); border-radius: 10px; padding: 9px 11px; margin-bottom: 7px; }
    .row { display: flex; align-items: center; gap: 7px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--orange); }
    .dot.thinking { background: var(--violet); } .dot.waiting { background: var(--red); }
    .name { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status { color: var(--muted); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; margin-top: 6px; }
    .bar > i { display: block; height: 100%; background: var(--orange); }
    .muted { color: var(--muted); }
    .empty { color: var(--muted); padding: 10px 4px 16px; }
    .file { display: flex; align-items: center; gap: 8px; background: rgba(217,119,87,0.15); border: 1px dashed rgba(217,119,87,0.6); border-radius: 10px; padding: 9px 11px; margin-bottom: 10px; }
    .file .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .file button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 14px; }
    .btn { display: block; width: 100%; text-align: left; font: inherit; color: var(--text); background: var(--card); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 9px 12px; margin-bottom: 7px; cursor: pointer; }
    .btn:hover { background: rgba(255,255,255,0.12); }
    .btn.primary { background: var(--orange); border-color: var(--orange); color: #fff; font-weight: 600; }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn small { display: block; font-weight: 400; opacity: .8; font-size: 11.5px; }
    #result { min-height: 18px; font-size: 12px; color: var(--green); margin-top: 4px; }
    #result.err { color: #ff8a8d; }
  </style>
</head>
<body>
  <header>
    <span>🦀</span>
    <h1>Clawd · Sesiones</h1>
    <button id="close" title="Cerrar">✕</button>
  </header>
  <main>
    <h2>Trabajando ahora</h2>
    <div id="list"></div>

    <h2 id="newTitle">Nueva sesión</h2>
    <div id="newBox"></div>
    <div id="result"></div>
  </main>
  <script src="sessions.js"></script>
</body>
</html>
